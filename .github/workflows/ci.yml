name: CI

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

permissions:
    contents: read

# Cancel in-progress runs on the same branch when a new commit is pushed.
# Master pushes are never cancelled (allow full pipeline to finish).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            HUSKY: '0'

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            # Node 24.15.0 (current LTS) bundles npm 11.12.1, which regressed
            # peerOptional handling (npm/cli#9249, 2026-04-17) — peerOptional deps
            # marked extraneous and removed. Combined with the long-standing
            # cross-platform optional-binaries bug (npm/cli#4828) this means lock
            # files generated on macOS arm64 fail Linux CI with EUSAGE
            # "Missing: <pkg>-linux-x64-gnu from lock file" for native bindings
            # (lightningcss, @unrs/resolver-binding). Both issues are fully
            # restored in npm 11.14.0 (2026-05-06) via arborist 9.5.0. Pin to
            # ^11.14.0 explicitly — npm@latest would track future majors that
            # may regress again.
            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install dependencies
              run: npm ci --ignore-scripts

            # Keyed on the lock file, so a @playwright/test bump invalidates the
            # cache and scripts/ensure-playwright.mjs (inside the gate) reinstalls
            # the builds that version actually needs.
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            # ONE step on purpose. `verify:ci` is the same command the pre-push hook
            # runs, and the `verify` inside it is a strict superset of every check
            # this job used to list separately. Adding a check HERE instead of to
            # the script is exactly what makes a green local gate stop predicting a
            # green CI — if it belongs in CI, it belongs in the script.
            - name: Verify (audit gate, types, lint, format, coverage, build, size, e2e)
              run: npm run verify:ci

            - name: Upload coverage report
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 14

            - name: Upload Playwright report on failure
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
