name: CI

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

permissions:
    contents: read

# Cancel in-progress runs on the same branch when a new commit is pushed.
# Master pushes are never cancelled (allow full pipeline to finish).
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            HUSKY: '0'

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            # Node 24.15.0 (current LTS) bundles npm 11.12.1, which regressed
            # peerOptional handling (npm/cli#9249, 2026-04-17) — peerOptional deps
            # marked extraneous and removed. Combined with the long-standing
            # cross-platform optional-binaries bug (npm/cli#4828) this means lock
            # files generated on macOS arm64 fail Linux CI with EUSAGE
            # "Missing: <pkg>-linux-x64-gnu from lock file" for native bindings
            # (lightningcss, @unrs/resolver-binding). Both issues are fully
            # restored in npm 11.14.0 (2026-05-06) via arborist 9.5.0. Pin to
            # ^11.14.0 explicitly — npm@latest would track future majors that
            # may regress again.
            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install dependencies
              run: npm ci --ignore-scripts

            # Keyed on the lock file, so a @playwright/test bump invalidates the
            # cache and scripts/ensure-playwright.mjs (inside the gate) reinstalls
            # the builds that version actually needs.
            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            # ONE step on purpose. `verify:ci` is the same command the pre-push hook
            # runs, and the `verify` inside it is a strict superset of every check
            # this job used to list separately. Adding a check HERE instead of to
            # the script is exactly what makes a green local gate stop predicting a
            # green CI — if it belongs in CI, it belongs in the script.
            - name: Verify (audit gate, types, lint, format, coverage, build, size, e2e)
              run: npm run verify:ci

            - name: Upload coverage report
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 14

            - name: Upload Playwright report on failure
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    # The content-variance fixture is mounted only under `import.meta.env.DEV`, so it cannot be reached
    # by the gate's `vite preview` run and needs a dev server of its own. Kept OUT of `verify` because
    # that would mean a second server on every local push; run here instead, so it is mandatory on every
    # PR and cannot be forgotten. `npm run verify:full` chains it locally.
    dev-smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            HUSKY: '0'

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Ensure Playwright browsers
              run: node scripts/ensure-playwright.mjs

            - name: Content-stress fixture (dev server, 5 widths)
              run: npm run smoke:dev

            - name: Upload Playwright report on failure
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report-dev
                  path: playwright-report/
                  retention-days: 7

    # Firefox and WebKit, on the geometry specs only. They are not in `verify` because three engines on
    # every spec triples the local e2e wall-clock, and a webkit font-metric difference in an unrelated
    # spec would then fail a push for a reason that has nothing to do with the change. Scoped by
    # `testMatch` in `e2e/support/cross-browser.ts`; a typo there collects ZERO tests and reports
    # success, which is why the step below asserts a test actually ran.
    cross-browser:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            HUSKY: '0'
            CROSS_BROWSER: '1'
            PLAYWRIGHT_BROWSERS: 'chromium,firefox,webkit'

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-xbrowser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Ensure Playwright browsers (chromium, firefox, webkit)
              run: node scripts/ensure-playwright.mjs

            - name: Build for the production geometry spec
              run: npm run build

            # `--list` first, so a `testMatch` that selects nothing fails HERE with a readable message
            # instead of passing silently as an empty run.
            - name: Assert every engine has tests to run
              run: node scripts/check-cross-browser-selection.mjs

            - name: Layout geometry on every engine (production routes)
              run: npm run test:e2e:prod

            - name: Content stress on every engine (dev server)
              run: npm run smoke:dev

            - name: Upload Playwright report on failure
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report-cross-browser
                  path: playwright-report/
                  retention-days: 7
