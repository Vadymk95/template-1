name: Release

# Release Please reads the Conventional Commits on master (commitlint enforces them at commit time) and
# keeps ONE open "release" pull request up to date: the next version by the commit types (feat → minor,
# fix → patch, a `!` or a BREAKING CHANGE footer → major), the CHANGELOG entry, package.json and the lock
# file. Merging that PR is the release: it tags `v<version>` and publishes the GitHub release. Nothing is
# published to npm — a template is forked, not installed.
#
# Config: release-please-config.json (what to bump, from which commit); .release-please-manifest.json
# (the version the tool starts from — keep it equal to package.json).
#
# The PR is opened with this workflow's own token, and that has a consequence worth knowing before it
# costs an hour: the runs it triggers are created in the `action_required` state and report NOTHING until
# a human approves them. A required status check that never reports is Pending forever, so the release PR
# sits at "Merging is blocked" with zero checks listed — which reads like a broken rule and is not one.
# Measured 2026-09-13: every run on the release branch came back `conclusion: action_required`.
# Two ways out. Click "Approve and run" on the runs in the Actions tab (or
# `gh api --method POST repos/OWNER/REPO/actions/runs/<id>/approve`) — one click per release, nothing is
# weakened. Or add a fine-grained PAT as the RELEASE_PLEASE_TOKEN secret and pass it as `token:` below,
# which removes the click for good. Do NOT reach for an admin bypass merge instead: bypass is not
# selective, it skips the status checks, the pull-request rule and the force-push rule together.
on:
    push:
        branches: [main, master]

permissions:
    contents: write
    issues: write
    pull-requests: write

concurrency:
    group: release-please
    cancel-in-progress: false

jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: googleapis/release-please-action@v4
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
