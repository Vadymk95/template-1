name: Security

# WHERE THIS WORKS — read before forking into a private repo.
#
# `gitleaks` works anywhere: it runs the scanner itself and fails the job on a
# finding, independent of any GitHub feature or plan. (One caveat: the action asks
# for a GITLEAKS_LICENSE when the repo is owned by an ORGANISATION; a personal
# account needs nothing.)
#
# `codeql` needs GitHub **code scanning** enabled, which is free on PUBLIC repos
# and a paid add-on on private ones. This repository is public, so it works as
# written. In a PRIVATE fork the analyze step fails when it tries to upload
# results, and the API says so plainly:
#   "Code scanning is not enabled for this repository." (HTTP 403)
# A private fork therefore has to either enable Advanced Security for the repo, or
# delete the `codeql` job below and keep `gitleaks`. Do not "fix" a red CodeQL job
# by weakening the workflow — it is a plan boundary, not a configuration mistake.

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    schedule:
        # Sunday 06:00 UTC — weekly catch-up scan picks up CVEs published mid-week.
        - cron: '0 6 * * 0'

# Avoid duplicate runs when a branch push triggers a PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    gitleaks:
        name: Secret scan (gitleaks)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@v7
              with:
                  # gitleaks needs commit history to scan past commits, not just HEAD.
                  fetch-depth: 0

            - name: Run gitleaks
              # SHA-pinned — tags are mutable and have been retargeted in supply-chain
              # attacks (tj-actions, 2025); Dependabot's github-actions ecosystem keeps
              # this fresh.
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Fail the job on any finding (default already, but explicit).
                  GITLEAKS_EXIT_CODE: 1

    codeql:
        name: CodeQL (JavaScript / TypeScript)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript]
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
                  # Adds the security-extended pack — broader coverage at the cost of run time.
                  # Drop to default if CodeQL becomes a bottleneck.
                  queries: security-extended
                  # Excludes the generated MSW worker, with the reason in the file.
                  config-file: ./.github/codeql/codeql-config.yml

            - name: Perform analysis
              uses: github/codeql-action/analyze@v4
              with:
                  category: '/language:${{ matrix.language }}'
