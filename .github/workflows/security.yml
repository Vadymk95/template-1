name: Security

# WHERE THIS WORKS — read before forking into a private repo.
#
# `gitleaks` works anywhere: it runs the scanner itself and fails the job on a
# finding, independent of any GitHub feature or plan. (One caveat: the action asks
# for a GITLEAKS_LICENSE when the repo is owned by an ORGANISATION; a personal
# account needs nothing.)
#
# `codeql` needs GitHub **code scanning** enabled, which is free on PUBLIC repos
# and a paid add-on on private ones. This repository is public, so it works as
# written. In a PRIVATE fork the analyze step fails when it tries to upload
# results, and the API says so plainly:
#   "Code scanning is not enabled for this repository." (HTTP 403)
# A private fork therefore has to either enable Advanced Security for the repo, or
# delete the `codeql` job below and keep `gitleaks`. Do not "fix" a red CodeQL job
# by weakening the workflow — it is a plan boundary, not a configuration mistake.

on:
    pull_request:
        branches: [main, master]
    push:
        branches: [main, master]
    schedule:
        # Sunday 06:00 UTC — weekly catch-up scan picks up CVEs published mid-week.
        - cron: '0 6 * * 0'

permissions:
    contents: read

# Avoid duplicate runs when a branch push triggers a PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    gitleaks:
        name: Secret scan (gitleaks)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout (full history)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # gitleaks needs commit history to scan past commits, not just HEAD.
                  fetch-depth: 0
                  persist-credentials: false

            - name: Run gitleaks
              # SHA-pinned — tags are mutable and have been retargeted in supply-chain
              # attacks (tj-actions, 2025); Dependabot's github-actions ecosystem keeps
              # this fresh.
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Fail the job on any finding (default already, but explicit).
                  GITLEAKS_EXIT_CODE: 1

    codeql:
        name: CodeQL (JavaScript / TypeScript)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  languages: ${{ matrix.language }}
                  # Adds the security-extended pack — broader coverage at the cost of run time.
                  # Drop to default if CodeQL becomes a bottleneck.
                  queries: security-extended
                  # Excludes the generated MSW worker, with the reason in the file.
                  config-file: ./.github/codeql/codeql-config.yml

            - name: Perform analysis
              uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  category: '/language:${{ matrix.language }}'

    zizmor:
        name: Workflow audit (zizmor)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # One pass, online (the action's default, with the job's read-only token): it verifies that
            # each pinned SHA belongs to its repository and its version comment, and flags actions with a
            # published advisory. The action runs zizmor from a container image pinned by digest;
            # `version` is the pin, Dependabot moves the action's SHA, and a newer zizmor is a deliberate
            # edit of `version`. `min-severity: medium` fails the job on Medium and High findings; the
            # rule remap and the one documented exception live in .github/zizmor.yml, which the local
            # command in the README reads too.
            - name: Run zizmor
              uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
              with:
                  version: 1.30.1
                  inputs: .github/workflows
                  config: .github/zizmor.yml
                  min-severity: medium
                  advanced-security: false
                  annotations: true
