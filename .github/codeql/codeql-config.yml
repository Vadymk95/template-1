name: 'CodeQL config'

# `public/mockServiceWorker.js` is generated by `msw init`, not written here. CodeQL
# correctly reports js/missing-origin-check on its `postMessage` handler, but the file
# never reaches production: `vite-plugins/` deletes it from `dist/` on every build
# (see the comment at vite.config.ts and `ls dist/` after `npm run build`), and the
# worker is only registered from the dev/test path in `src/main.tsx`.
#
# Ignored rather than dismissed in the UI so the reason lives in the repo and survives
# a re-analysis. If the removal plugin is ever dropped, delete this entry FIRST — the
# alert is the signal that the worker started shipping.
paths-ignore:
    - public/mockServiceWorker.js
